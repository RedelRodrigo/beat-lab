services:
  - type: web
    name: beat-lab-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: DB_PATH
        value: /data/beatlab.db
      - key: TRUST_PROXY
        value: "1"
      - key: ALLOWED_ORIGIN
        sync: false
    disk:
      name: beatlab-data
      mountPath: /data
      sizeGB: 1
